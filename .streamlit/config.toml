[theme]
base = "dark"
primaryColor = "#7FA24A"
backgroundColor = "#10150B"
secondaryBackgroundColor = "#1F2817"
textColor = "#EFEBDD"
font = "sans serif"
baseRadius = "0.75rem"
borderColor = "#323D24"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0B0F07"
secondaryBackgroundColor = "#161D0F"
textColor = "#E6E2D0"
primaryColor = "#A3C265"
borderColor = "#1F2817"

[server]
enableStaticServing = true     # serve static/camuflado.svg (textura da farda)

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
