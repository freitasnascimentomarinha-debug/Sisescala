[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#16213A"
textColor = "#EAF0FA"
font = "sans serif"
baseRadius = "0.75rem"
borderColor = "#223049"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#070B16"
secondaryBackgroundColor = "#101A30"
textColor = "#E3EBF7"
primaryColor = "#60A5FA"
borderColor = "#16213A"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
